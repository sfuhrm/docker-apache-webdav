version: '2'
services:
  apache_webdav:
#    image: sfuhrm/docker-apache-webdav # comment out this line if you are building from source.
    build: . # comment out this line if you are just pulling the docker hub image.
#    ports: # enable this if you are not using reverse proxy, otherwise leave commented out
#      - "8080:8080"
    volumes:
      - "/path/to/your/share:/media/data"
      - "/path/to/your/htpasswd:/etc/webdav/htpasswd:ro"
    environment:
      HTPASSWD_FILE: /etc/webdav/htpasswd
