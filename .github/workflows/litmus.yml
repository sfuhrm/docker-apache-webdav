---
name: Litmus WebDAV Tests
permissions:
  contents: read

"on":
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  litmus_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t docker-apache-webdav .

      - name: Create htpasswd file
        run: |
          printf 'litmus:%s\n' "$(openssl passwd -6 litmus)" > htpasswd

      - name: Run container
        run: |
          docker run -d --name webdav-litmus \
            -p 8083:8080 \
            -v $(pwd)/htpasswd:/etc/webdav/htpasswd:ro \
            -e HTPASSWD_FILE=/etc/webdav/htpasswd \
            docker-apache-webdav

      - name: Wait for container to become healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' webdav-litmus 2>/dev/null || echo starting)"
            echo "Status: $status"
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time."
          docker logs webdav-litmus
          exit 1

      - name: Install litmus
        run: |
          sudo apt-get update
          sudo apt-get install -y litmus

      - name: "Run litmus WebDAV protocol compliance tests"
        run: |
          # litmus is the WebDAV protocol compliance test suite. It is run
          # against the running container to verify RFC2518/RFC4918 compliance.
          #
          # The server provides WebDAV via mod_dav (`Dav On`): PUT, DELETE,
          # MKCOL, COPY, MOVE, PROPFIND, OPTIONS, LOCK and UNLOCK. This run
          # exercises the `basic`, `http` and `copymove` suites.
          TESTS="basic http copymove" litmus http://localhost:8083/ litmus litmus
