LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

DavLockDB /var/lib/apache2/dav/DavLock

AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/javascript application/javascript application/xml application/json application/rss+xml application/atom+xml image/svg+xml

PidFile /var/lib/apache2/httpd.pid

ServerTokens Prod
ServerSignature Off
ServerName localhost

<VirtualHost *:8080>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    LimitRequestBody 0
    DavDepthInfinity off

    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN

    DocumentRoot /media/data/

    <Directory "/media/data/">
        Dav On

        Options Indexes

        AuthType Basic
        AuthName "Restricted"
        AuthBasicProvider file
        AuthUserFile /var/lib/apache2/htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
